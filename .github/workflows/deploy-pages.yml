name: Deploy Expo web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "packages/app/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      EXPO_PUBLIC_APP_NAME: ${{ vars.EXPO_PUBLIC_APP_NAME }}
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_APP_EMAIL: ${{ vars.EXPO_PUBLIC_APP_EMAIL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ANDROID_DOWNLOAD_URL: ${{ vars.EXPO_PUBLIC_ANDROID_DOWNLOAD_URL }}
      EXPO_PUBLIC_IOS_DOWNLOAD_URL: ${{ vars.EXPO_PUBLIC_IOS_DOWNLOAD_URL }}
      EXPO_PUBLIC_WINDOWS_DOWNLOAD_URL: ${{ vars.EXPO_PUBLIC_WINDOWS_DOWNLOAD_URL }}
      EXPO_PUBLIC_TMDB_API_KEYS: ${{ vars.EXPO_PUBLIC_TMDB_API_KEYS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo environment
        run: |
          required_vars=(
            EXPO_PUBLIC_APP_NAME
            EXPO_PUBLIC_APP_ENV
            EXPO_PUBLIC_APP_EMAIL
            EXPO_PUBLIC_API_URL
            EXPO_PUBLIC_ANDROID_DOWNLOAD_URL
            EXPO_PUBLIC_IOS_DOWNLOAD_URL
            EXPO_PUBLIC_WINDOWS_DOWNLOAD_URL
            EXPO_PUBLIC_TMDB_API_KEYS
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing environment variable::$name is empty. Add it in GitHub Actions repository variables or in the github-pages environment variables."
              exit 1
            fi
          done

      - name: Build Expo web
        run: npm --workspace app run build:web

      - name: Disable Jekyll
        run: touch packages/app/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
